[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatehouse-interview"
version = "0.1.0"
description = "A deterministic authorization service used for change-review interviews"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gatehouse = "gatehouse.cli:main"

[tool.setuptools]
packages = ["gatehouse"]

